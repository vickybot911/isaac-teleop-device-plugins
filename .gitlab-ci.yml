include:
  - project: 'omniverse/devplat/gitlab/templates/common/compliance'
    file: 'modules/omniverse-repo-compliance.gitlab-ci.yml'

.osec:stage_base:
  stage: .post

stages:
  - format
  - build

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # Use a consistent clang-format version; tools/check-format.sh defaults to clang-format-14
  CLANG_FORMAT_BIN: "clang-format-14"
  # Speed up builds by using a local cmake build dir inside CI workspace
  BUILD_DIR: "$CI_PROJECT_DIR/build-core-ci"

.cmake-cache: &cmake-cache
  cache:
    key: "cmake-${CI_COMMIT_REF_SLUG}"
    paths:
      - ${BUILD_DIR}

.linux-image: &linux-image
  image: "debian:bookworm-slim"
  before_script:
    - apt-get update -y
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        ca-certificates git build-essential cmake ninja-build \
        clang-format-14
    - update-ca-certificates

clang-format:
  stage: format
  <<: *linux-image
  script:
    - bash tools/check-format.sh "$CLANG_FORMAT_BIN"

build-core-no-manus:
  stage: build
  <<: *linux-image
  <<: *cmake-cache
  script:
    - cmake -S . -B ${BUILD_DIR} -G "Unix Makefiles" -DBUILD_MANUS_PLUGIN=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - cmake --build ${BUILD_DIR} -- -j"$(nproc)"
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - ${BUILD_DIR}/src/libIsaacSimHandTrackerCAPI.so*
      - ${BUILD_DIR}/vendor/**/lib*.so*


